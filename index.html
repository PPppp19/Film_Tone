<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Film Tone">
<meta name="theme-color" content="#121110">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Film Tone</title>
<style>
  :root { --bg:#121110; --panel:#1c1a18; --line:#2e2a26; --text:#f1ebe3; --muted:#9a9189; --accent:#ff8a2a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Thonburi",system-ui,sans-serif; }
  body { padding:env(safe-area-inset-top) 0 0; min-height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px 6px; }
  h1 { font-size:20px; margin:0; letter-spacing:.5px; }
  h1 span { color:var(--accent); }
  .hint { font-size:12px; color:var(--muted); }
  #stageWrap { position:sticky; top:0; z-index:5; background:var(--bg); padding:4px 12px 0; }
  #stage { position:relative; border-radius:14px; background:#0a0908; height:42vh;
    display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  #view { max-width:100%; max-height:100%; display:none; }
  #empty { text-align:center; color:var(--muted); padding:40px 20px; cursor:pointer; }
  #empty .big { font-size:54px; margin-bottom:8px; }
  #badge { position:absolute; top:10px; left:10px; background:rgba(0,0,0,.6); padding:4px 10px; border-radius:20px; font-size:12px; display:none; }
  #presets { display:flex; gap:10px; overflow-x:auto; padding:12px 12px 4px; scrollbar-width:none; }
  #presets::-webkit-scrollbar { display:none; }
  .preset { position:relative; flex:0 0 auto; width:72px; text-align:center; font-size:11px; color:var(--muted); cursor:pointer; }
  .preset canvas, .preset .ph { width:72px; height:72px; border-radius:10px; object-fit:cover; display:block; border:2px solid transparent; background:#2a2622; }
  .preset .ph { display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--muted); }
  .preset.on { color:var(--text); }
  .preset.on canvas, .preset.on .ph { border-color:var(--accent); }
  .preset .lab { margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .preset .del { position:absolute; top:-4px; right:-4px; width:20px; height:20px; border-radius:50%; background:#3a3430; color:#fff; font-size:13px; line-height:20px; }
  #tabs { display:flex; gap:6px; padding:10px 12px 2px; align-items:center; }
  #tabs button.tab { flex:1; padding:9px 4px; font-size:14px; border-radius:10px; background:var(--panel); color:var(--muted); border:1px solid var(--line); font-weight:600; }
  #tabs button.tab.on { background:#2b231c; color:var(--accent); border-color:#5a3a1c; }
  .panel { display:none; padding:4px 16px 4px; }
  .panel.on { display:block; }
  .row { display:flex; align-items:center; gap:10px; margin:10px 0; font-size:14px; }
  .row label { width:112px; flex:0 0 auto; }
  .row input[type=range] { flex:1; accent-color:var(--accent); }
  .row .v { width:36px; text-align:right; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .row select, .row input[type=date] { flex:1; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 8px; font:inherit; font-size:14px; }
  .row input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); }
  .small { font-size:12px; color:var(--muted); padding:2px 16px 0; }
  .linkbtn { background:none; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .actions { position:sticky; bottom:0; display:flex; gap:10px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, var(--bg) 30%); }
  .actions button { flex:1; font:inherit; font-size:16px; font-weight:600; padding:14px; border-radius:12px; border:none; cursor:pointer; }
  .secondary { background:var(--panel); color:var(--text); border:1px solid var(--line) !important; }
  .primary { background:var(--accent); color:#1a0f05; }
  button:disabled { opacity:.4; }
  #result { position:fixed; inset:0; background:rgba(0,0,0,.94); display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px; z-index:30; }
  #result img { max-width:100%; max-height:72vh; border-radius:6px; -webkit-touch-callout:default; }
  #result p { color:var(--muted); font-size:14px; text-align:center; }
  #result button { font:inherit; font-size:16px; padding:12px; border-radius:12px; width:200px; margin-top:6px; }
  #busy { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:40; font-size:15px; }
  .seg { display:flex; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:2px; }
  .seg button { background:none; border:none; color:var(--muted); font:inherit; font-size:13px; font-weight:600; padding:6px 12px; border-radius:8px; cursor:pointer; }
  .seg button.on { background:#2b231c; color:var(--accent); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .25s; }
  .actions.cam { align-items:center; justify-content:space-between; padding-left:32px; padding-right:32px; }
  .actions .round { flex:none; width:52px; height:52px; padding:0; border-radius:50%; font-size:18px; }
  #shutter { flex:none; width:74px; height:74px; border-radius:50%; background:#f1ebe3; border:5px solid var(--accent) !important; box-shadow:0 0 0 3px var(--bg) inset; padding:0; }
  #shutter:active { transform:scale(.94); background:#d8d0c6; }
  #fsOpen { position:absolute; top:10px; right:10px; display:none; background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:18px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }
  body.cam #fsOpen { display:block; }
  #fs { position:fixed; inset:0; background:#000; z-index:25; display:none; overflow:hidden; touch-action:none; }
  #fs.on { display:block; }
  #fsView { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #guide { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; filter:drop-shadow(0 0 1.5px rgba(0,0,0,.55)); }
  #guide .l { stroke:#fff; stroke-opacity:.55; stroke-width:1.2; fill:none; vector-effect:non-scaling-stroke; }
  #guide .f { stroke-opacity:.28; stroke-dasharray:6 6; }
  #guide .d { fill:#fff; fill-opacity:.7; stroke:none; }
  #guide text { fill:#fff; fill-opacity:.7; font-size:15px; font-family:-apple-system,system-ui,sans-serif; }
  #fsFlash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #fsTip { position:absolute; left:50%; top:calc(64px + env(safe-area-inset-top)); transform:translateX(-50%); background:rgba(0,0,0,.55); color:#fff; padding:7px 14px; border-radius:16px; font-size:13px; text-align:center; max-width:80%; opacity:0; transition:opacity .4s; pointer-events:none; }
  #fsTop { position:absolute; top:0; left:0; right:0; display:flex; gap:8px; align-items:center;
    padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left)); }
  .fsb { background:rgba(0,0,0,.45); color:#fff; border:1px solid rgba(255,255,255,.22); border-radius:18px; font:inherit; font-size:14px; padding:7px 12px; cursor:pointer; }
  .fsb.chip { max-width:42%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #fsRot { display:none; }
  #fsClose { margin-right:auto; }
  #fsChips { position:absolute; left:0; right:0; bottom:calc(118px + env(safe-area-inset-bottom)); display:none; gap:8px; overflow-x:auto; padding:6px 12px; scrollbar-width:none; }
  #fsChips::-webkit-scrollbar { display:none; }
  #fsChips.on { display:flex; }
  #fsChips button { flex:0 0 auto; }
  #fsChips button.on { background:var(--accent); color:#1a0f05; border-color:var(--accent); }
  #fsBar { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:space-around;
    padding:14px calc(12px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); }
  #fsBar .round { width:54px; height:54px; padding:0; border-radius:50%; font-size:18px; background-size:cover; background-position:center; }
  #fsShutter { width:76px; height:76px; border-radius:50%; background:rgba(255,255,255,.92); border:5px solid var(--accent); padding:0; cursor:pointer; }
  #fsShutter:active { transform:scale(.93); }
  @media (orientation: landscape) {
    #fsBar { top:0; bottom:0; left:auto; right:0; flex-direction:column; justify-content:space-around;
      padding:12px calc(14px + env(safe-area-inset-right)) 12px 12px; }
    #fsChips { bottom:calc(10px + env(safe-area-inset-bottom)); right:calc(110px + env(safe-area-inset-right)); left:env(safe-area-inset-left); }
    #fsTop { right:calc(100px + env(safe-area-inset-right)); }
  }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#2b231c; color:var(--text); padding:8px 14px; border-radius:20px; font-size:13px; display:none; z-index:35; }
</style>
</head>
<body>
<header>
  <h1>Film <span>Tone</span></h1>
  <div class="seg"><button id="modeEdit" class="on">แต่งรูป</button><button id="modeCam">📷 กล้อง</button></div>
</header>

<div id="stageWrap">
  <div id="stage">
    <div id="empty"><div class="big">🎞️</div>แตะเพื่อเลือกรูป</div>
    <canvas id="view"></canvas>
    <div id="badge">ต้นฉบับ</div>
    <div id="flash"></div>
    <button id="fsOpen" title="ถ่ายแบบเต็มจอ">⛶ เต็มจอ</button>
  </div>
</div>

<!-- full-screen camera -->
<div id="fs">
  <canvas id="fsView"></canvas>
  <svg id="guide"></svg>
  <div id="fsFlash"></div>
  <div id="fsTip"></div>
  <div id="fsTop">
    <button id="fsClose" class="fsb">✕</button>
    <button id="fsFilterBtn" class="fsb chip">🎞 <span id="fsFilterName"></span></button>
    <button id="fsGuideBtn" class="fsb chip">▦ <span id="fsGuideName">ไกด์</span></button>
    <button id="fsRot" class="fsb" title="หมุน/กลับด้านเส้นไกด์">↻</button>
  </div>
  <div id="fsChips"></div>
  <div id="fsBar">
    <button id="fsFlip" class="fsb round">🔄</button>
    <button id="fsShutter" aria-label="ถ่ายรูป"></button>
    <button id="fsLast" class="fsb round" title="ดู/แต่งรูปล่าสุด"></button>
  </div>
</div>

<div id="presets"></div>
<div id="tabs"></div>
<div id="panels"></div>
<div class="small">แตะชื่อค่า 2 ครั้ง = รีเซ็ตค่านั้น · กดค้างที่รูป = ดูต้นฉบับ</div>

<div class="actions" id="editActions">
  <button class="secondary" id="pick">เลือกรูป</button>
  <button class="primary" id="save" disabled>บันทึกรูป</button>
</div>
<div class="actions cam" id="camActions" style="display:none">
  <button class="secondary round" id="flip" title="สลับกล้องหน้า/หลัง">🔄</button>
  <button id="shutter" aria-label="ถ่ายรูป"></button>
  <button class="secondary round" id="nativeCam" title="ใช้กล้อง iPhone ความละเอียดเต็ม">HD</button>
</div>

<input id="file" type="file" accept="image/*" hidden>
<input id="camFile" type="file" accept="image/*" capture="environment" hidden>

<div id="result">
  <img id="resultImg" alt="">
  <p>กดค้างที่รูปแล้วเลือก “บันทึกลงในรูปภาพ”</p>
  <button class="secondary" id="closeResult">ปิด</button>
</div>
<div id="busy">กำลังล้างฟิล์ม…</div>
<div id="toast"></div>

<script>
// =============== Film stocks ===============
// p = base look of the film (tone curve per channel, saturation, split toning)
// d = default values for the adjustable settings
const PRESETS = [
  { id:'none', name:'ต้นฉบับ', p:null, d:{ grain:0, vig:0 } },
  { id:'warm', name:'Warm 400', p:{con:.12, sat:.92, gam:[.96,.99,1.03], lift:[.055,.045,.04], gain:[1,.98,.93], sh:[0,.01,.025], hi:[.04,.02,-.02]}, d:{ grain:20, vig:20, halation:10, soft:10 } },
  { id:'gold', name:'Gold 200', p:{con:.28, sat:1.15, gam:[.95,.98,1.08], lift:[.04,.03,.01], gain:[1,.97,.86], sh:[.02,.01,-.02], hi:[.05,.03,-.04]}, d:{ grain:25, vig:30, halation:15 } },
  { id:'green', name:'Green 400', p:{con:.2, sat:1.05, gam:[1.02,.97,1], lift:[.03,.05,.05], gain:[.97,1,.97], sh:[-.02,.03,.02], hi:[.01,.02,-.01]}, d:{ grain:22, vig:25 } },
  { id:'night', name:'Tungsten 800', p:{con:.3, sat:1, gam:[1.04,1,.95], lift:[.02,.04,.07], gain:[.97,.98,1], sh:[-.03,.01,.05], hi:[.06,.01,-.02]}, d:{ grain:35, gsize:20, gcolor:15, vig:30, halation:55, leak:25 } },
  { id:'bw', name:'ขาวดำ 400', p:{bw:true, con:.45, sat:0, gam:[1,1,1], lift:[.04,.04,.04], gain:[.97,.97,.97], sh:[0,0,0], hi:[0,0,0]}, d:{ grain:45, gsize:20, vig:35 } },
  { id:'expired', name:'ฟิล์มหมดอายุ', p:{con:-.1, sat:.8, gam:[.95,1,1.05], lift:[.12,.08,.1], gain:[.98,.92,.85], sh:[.04,0,.04], hi:[.05,.03,-.04]}, d:{ grain:50, gsize:22, gcolor:30, vig:35, leak:55, dust:30, fade:20, soft:20, ca:20 } },
  { id:'dispo', name:'กล้องใช้แล้วทิ้ง', p:{con:.4, sat:1.2, gam:[.97,.98,1.04], lift:[.03,.03,.02], gain:[1,.98,.9], sh:[0,.01,-.01], hi:[.03,.02,-.02]}, d:{ grain:35, vig:55, leak:20, date:true, soft:25, ca:30, halation:15, exp:6 } },

  // ---- Japan tones ----
  // japan_01 was measured from a before/after pair (curves + color matrix)
  { id:'japan_01', name:'japan_01', p:{ sat:1, sh:[0,0,0], hi:[0,0,0],
      curves:[[.103,.182,.263,.352,.428,.498,.559,.615,.668,.72,.766,.809,.859,.909,.955,.976,.986],
              [.073,.161,.237,.309,.378,.442,.499,.554,.61,.666,.716,.759,.807,.858,.908,.929,.943],
              [.075,.133,.195,.26,.323,.386,.454,.514,.567,.621,.676,.723,.771,.831,.891,.907,.931]],
      mat:[[1.225,.338,-.525],[-.396,1.578,-.139],[-.342,-.251,1.575]], off:[-.057,.004,.058] },
    d:{ grain:6, vig:0 } },
  // bright, soft, anime-like: cyan skies, yellowish greens, lifted blacks
  { id:'japan_02', name:'japan_02', p:{con:-.08, sat:1.12, gam:[.9,.88,.9], lift:[.07,.07,.09], gain:[1,1,1], sh:[.015,0,.02], hi:[.02,.02,0],
      mat:[[.92,.1,-.02],[0,.84,.16],[0,.04,.96]] }, d:{ grain:6, vig:0, exp:16, sat:8 } },
  // pale cool blue/cyan, light and airy
  { id:'japan_03', name:'japan_03', p:{con:.04, sat:.92, gam:[1.04,.97,.94], lift:[.05,.08,.1], gain:[.95,1,1], sh:[-.02,.02,.035], hi:[-.01,.02,.02],
      mat:[[1,0,0],[0,.88,.12],[0,.05,.95]] }, d:{ grain:10, vig:0, exp:5, fade:8 } },
  // slightly muddy blue, cinematic: teal shadows, warm skin, muted color
  { id:'japan_04', name:'japan_04', p:{con:.22, sat:.85, gam:[1.02,1,.96], lift:[.03,.05,.08], gain:[.97,.97,.94], sh:[-.035,0,.05], hi:[.04,.02,-.015],
      mat:[[1.03,0,-.03],[-.02,1,.02],[-.02,.02,1]] }, d:{ grain:12, vig:15 } },
  // blue-green, clean and minimal, stronger contrast
  { id:'japan_05', name:'japan_05', p:{con:.36, sat:1.05, gam:[1.02,.98,.97], lift:[0,.02,.035], gain:[1,1,1], sh:[-.03,.02,.04], hi:[.01,.01,0],
      mat:[[1,0,0],[0,.87,.13],[-.02,.04,.98]] }, d:{ grain:8, vig:10 } },
  // warm white, soft sunlight, gentle brown tone
  { id:'japan_06', name:'japan_06', p:{con:-.1, sat:.84, gam:[.95,.97,1.05], lift:[.08,.06,.04], gain:[1,.97,.9], sh:[.03,.015,0], hi:[.03,.02,-.02],
      mat:[[1.02,.02,-.04],[0,1,0],[0,.02,.98]] }, d:{ grain:12, vig:5, exp:3, fade:10 } },
  // cool, stylish, moody blue with deep shadows
  { id:'japan_07', name:'japan_07', p:{con:.36, sat:.9, gam:[1.05,1.02,.98], lift:[.02,.03,.05], gain:[.96,.97,.98], sh:[-.035,0,.045], hi:[.03,.01,-.02],
      mat:[[1.04,-.02,-.02],[-.02,1,.02],[-.03,.03,1]] }, d:{ grain:15, vig:25, exp:-8 } },
];

const DEFAULTS = { intensity:100, exp:0, con:0, hl:0, sh:0, fade:0, temp:0, tint:0, sat:0,
  grain:20, gsize:15, gcolor:0, halation:0, soft:0, ca:0, vig:20,
  leak:0, leakPos:'tr', dust:0, scratch:0, border:'none', date:false, dateColor:'orange' };

const GROUPS = [
  { name:'แสง', items:[
    { k:'exp', label:'รับแสง', min:-100, max:100 },
    { k:'con', label:'คอนทราสต์', min:-100, max:100 },
    { k:'hl', label:'ไฮไลต์', min:-100, max:100 },
    { k:'sh', label:'เงา', min:-100, max:100 },
    { k:'fade', label:'ซีดด้าน (Fade)', min:0, max:100 },
  ]},
  { name:'สี', items:[
    { k:'intensity', label:'ความเข้มฟิล์ม', min:0, max:100 },
    { k:'temp', label:'อุณหภูมิสี', min:-100, max:100 },
    { k:'tint', label:'เขียว ↔ ม่วง', min:-100, max:100 },
    { k:'sat', label:'ความสดสี', min:-100, max:100 },
  ]},
  { name:'เนื้อฟิล์ม', items:[
    { k:'grain', label:'เกรน', min:0, max:100 },
    { k:'gsize', label:'ขนาดเกรน', min:10, max:40, fmt:v => (v/10).toFixed(1) },
    { k:'gcolor', label:'เกรนสี', min:0, max:100 },
    { k:'halation', label:'แสงฟุ้งแดง', min:0, max:100 },
    { k:'soft', label:'ความนุ่มเลนส์', min:0, max:100 },
    { k:'ca', label:'สีเหลื่อมขอบ', min:0, max:100 },
    { k:'vig', label:'ขอบมืด', min:0, max:100 },
  ]},
  { name:'เอฟเฟกต์', items:[
    { k:'leak', label:'แสงรั่ว', min:0, max:100 },
    { k:'leakPos', label:'ตำแหน่งแสงรั่ว', type:'select', opts:[['tr','มุมขวาบน'],['tl','มุมซ้ายบน'],['br','มุมขวาล่าง'],['bl','มุมซ้ายล่าง'],['edge','แถบขอบซ้าย']] },
    { k:'dust', label:'ฝุ่น', min:0, max:100 },
    { k:'scratch', label:'รอยขีดข่วน', min:0, max:100 },
    { type:'button', label:'สุ่มตำแหน่งฝุ่น/รอยใหม่', id:'reseed' },
    { k:'border', label:'กรอบรูป', type:'select', opts:[['none','ไม่มี'],['white','ขอบขาว'],['film','ขอบฟิล์ม 35mm']] },
    { k:'date', label:'ตัวเลขวันที่', type:'check' },
    { k:'dateColor', label:'สีตัวเลข', type:'select', opts:[['orange','ส้ม'],['red','แดง'],['yellow','เหลือง']] },
    { type:'date', label:'วันที่' },
  ]},
];

const $ = id => document.getElementById(id);
const state = Object.assign({}, DEFAULTS, { preset: PRESETS[1], seed: 12345 });
let img = null, srcPrev = null, srcThumb = null;
const view = $('view'), vctx = view.getContext('2d');
let dateStr = new Date().toISOString().slice(0, 10);

// =============== helpers ===============
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function free(c) { if (c) { c.width = 0; c.height = 0; } }
function sstep(a, b, x) { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(rnd) { return (rnd() + rnd() + rnd() + rnd() - 2) * 1.73; }
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); c.fill(); }
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 1600); }

// =============== tone curves ===============
function filmLUT(p, P) {
  const C = [];
  for (let c = 0; c < 3; c++) {
    const a = new Float32Array(256);
    if (p.curves) {
      const k = p.curves[c], n = k.length - 1;
      for (let i = 0; i < 256; i++) {
        const t = Math.min(1, P[i]) * n, j = Math.min(n - 1, t | 0), f = t - j;
        a[i] = k[j] + (k[j + 1] - k[j]) * f;
      }
      C.push(a); continue;
    }
    for (let i = 0; i < 256; i++) {
      let x = Math.pow(P[i], p.gam[c]);
      const s = x * x * (3 - 2 * x);
      x = Math.max(0, Math.min(1, x + (s - x) * p.con * 1.6));
      a[i] = p.lift[c] + x * (p.gain[c] - p.lift[c]);
    }
    C.push(a);
  }
  return C;
}
function userLUT(st) {
  const U = new Float32Array(1024);
  const con = st.con / 100, hl = st.hl / 100, sh = st.sh / 100, f = st.fade / 100;
  for (let i = 0; i < 1024; i++) {
    let x = i / 1023;
    const s = x * x * (3 - 2 * x);
    x += (s - x) * con * 1.3;
    x += hl * .22 * sstep(.45, 1, x);
    x += sh * .22 * (1 - sstep(0, .55, x));
    x = Math.max(0, Math.min(1, x));
    U[i] = f * .25 + x * (1 - f * .31);
  }
  return U;
}

// =============== pass 1: color, tone, vignette, chromatic aberration ===============
function colorPass(src, w, h, st, ctx) {
  const out = ctx.createImageData(w, h), s = src.data, o = out.data;
  const pr = st.preset.p;
  const e = Math.pow(2, st.exp / 100);
  const P = new Float32Array(256);
  for (let i = 0; i < 256; i++) { let x = i / 255 * e; if (x > .8) x = .8 + .2 * (1 - Math.exp(-(x - .8) / .2)); P[i] = x; }
  const C = pr ? filmLUT(pr, P) : null;
  const m = pr && pr.mat ? pr.mat : null, mo = (pr && pr.off) || [0, 0, 0];
  const U = userLUT(st);
  const k = st.intensity / 100, satU = 1 + st.sat / 100, temp = st.temp / 100, tint = st.tint / 100;
  const vig = st.vig / 100 * .85;
  const M = Math.max(w, h), cs = st.ca / 100 * M * .004;
  const caX = cs * w / M, caY = cs * h / M;
  const colN = new Float32Array(w);
  for (let x = 0; x < w; x++) colN[x] = (x / w - .5) * 2;
  const idx = v => v <= 0 ? 0 : v >= 1 ? 1023 : (v * 1023) | 0;
  for (let y = 0; y < h; y++) {
    const ny = (y / h - .5) * 2, ny2 = ny * ny;
    const oy = Math.round(ny * caY);
    const yr = Math.min(h - 1, Math.max(0, y + oy)), yb = Math.min(h - 1, Math.max(0, y - oy));
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      let iR = i, iB = i;
      if (cs > 0) {
        const ox = Math.round(colN[x] * caX);
        iR = (yr * w + Math.min(w - 1, Math.max(0, x + ox))) * 4;
        iB = (yb * w + Math.min(w - 1, Math.max(0, x - ox))) * 4;
      }
      const r0 = s[iR], g0 = s[i + 1], b0 = s[iB + 2];
      const nr = P[r0], ng = P[g0], nb = P[b0];
      let r, g, b;
      if (pr) {
        if (pr.bw) { const li = Math.round(.3 * r0 + .59 * g0 + .11 * b0); r = g = b = C[0][li]; }
        else { r = C[0][r0]; g = C[1][g0]; b = C[2][b0]; }
        if (m) {
          const r1 = m[0][0] * r + m[0][1] * g + m[0][2] * b + mo[0];
          const g1 = m[1][0] * r + m[1][1] * g + m[1][2] * b + mo[1];
          const b1 = m[2][0] * r + m[2][1] * g + m[2][2] * b + mo[2];
          r = r1; g = g1; b = b1;
        }
        const lum = .299 * r + .587 * g + .114 * b;
        r = lum + (r - lum) * pr.sat; g = lum + (g - lum) * pr.sat; b = lum + (b - lum) * pr.sat;
        const ws = (1 - lum) * (1 - lum), wh = lum * lum;
        r += pr.sh[0] * ws + pr.hi[0] * wh; g += pr.sh[1] * ws + pr.hi[1] * wh; b += pr.sh[2] * ws + pr.hi[2] * wh;
        r = nr + (r - nr) * k; g = ng + (g - ng) * k; b = nb + (b - nb) * k;
      } else { r = nr; g = ng; b = nb; }
      if (temp) { r += temp * .07; b -= temp * .08; }
      if (tint) { g -= tint * .05; r += tint * .025; b += tint * .025; }
      r = U[idx(r)]; g = U[idx(g)]; b = U[idx(b)];
      if (satU !== 1) {
        const l = .299 * r + .587 * g + .114 * b;
        r = l + (r - l) * satU; g = l + (g - l) * satU; b = l + (b - l) * satU;
      }
      if (vig > 0) {
        const d = (colN[x] * colN[x] + ny2) / 2;
        const f = 1 - vig * d * (.6 + .4 * d);
        r *= f; g *= f; b *= f;
      }
      o[i] = r <= 0 ? 0 : r >= 1 ? 255 : r * 255;
      o[i + 1] = g <= 0 ? 0 : g >= 1 ? 255 : g * 255;
      o[i + 2] = b <= 0 ? 0 : b >= 1 ? 255 : b * 255;
      o[i + 3] = 255;
    }
  }
  ctx.putImageData(out, 0, 0);
}

// =============== lens softness ===============
function applySoft(cv, amt) {
  const w = cv.width, h = cv.height, f = 1.6 + amt * 4;
  const sm = mk(Math.max(2, Math.round(w / f)), Math.max(2, Math.round(h / f)));
  const sx = sm.getContext('2d'); sx.imageSmoothingQuality = 'high'; sx.drawImage(cv, 0, 0, sm.width, sm.height);
  const ctx = cv.getContext('2d');
  ctx.save(); ctx.globalAlpha = Math.min(.85, amt * .9); ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(sm, 0, 0, w, h); ctx.restore(); free(sm);
}

// =============== halation (red glow around highlights) ===============
function applyHalation(cv, amt) {
  const w = cv.width, h = cv.height;
  const sw = Math.max(8, Math.round(w / 10)), sh = Math.max(8, Math.round(h / 10));
  const a = mk(sw, sh), ax = a.getContext('2d');
  ax.drawImage(cv, 0, 0, sw, sh);
  const d = ax.getImageData(0, 0, sw, sh), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const l = (.299 * p[i] + .587 * p[i + 1] + .114 * p[i + 2]) / 255;
    const m = Math.max(0, (l - .68) / .32);
    p[i] = 255 * m; p[i + 1] = 55 * m; p[i + 2] = 20 * m;
  }
  ax.putImageData(d, 0, 0);
  const b = mk(Math.max(3, sw >> 2), Math.max(3, sh >> 2));
  b.getContext('2d').drawImage(a, 0, 0, b.width, b.height);
  ax.globalCompositeOperation = 'screen'; ax.drawImage(b, 0, 0, sw, sh);
  const ctx = cv.getContext('2d');
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = Math.min(1, amt * 1.1); ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(a, 0, 0, w, h); ctx.restore(); free(a); free(b);
}

// =============== grain ===============
function noiseGrid(gw, gh) { const g = new Float32Array(gw * gh); for (let i = 0; i < g.length; i++) g[i] = gauss(Math.random); return g; }
function applyGrain(cv, st, scale) {
  const w = cv.width, h = cv.height, ctx = cv.getContext('2d');
  const d = ctx.getImageData(0, 0, w, h), o = d.data;
  const cell = Math.max(1, st.gsize / 10 * scale);
  const gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2;
  const mono = st.grain / 100 * .13 * (cell > 1.2 ? 1.25 : 1), col = st.gcolor / 100 * .09;
  const N = noiseGrid(gw, gh);
  const NR = col ? noiseGrid(gw, gh) : null, NG = col ? noiseGrid(gw, gh) : null, NB = col ? noiseGrid(gw, gh) : null;
  const xi = new Int32Array(w), xf = new Float32Array(w);
  for (let x = 0; x < w; x++) { const v = x / cell; xi[x] = v | 0; xf[x] = v - (v | 0); }
  for (let y = 0; y < h; y++) {
    const vy = y / cell, yi = vy | 0, fy = vy - yi, r0 = yi * gw, r1 = r0 + gw;
    for (let x = 0; x < w; x++) {
      const a = xi[x], fx = xf[x];
      const i00 = r0 + a, i10 = i00 + 1, i01 = r1 + a, i11 = i01 + 1;
      const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy), w01 = (1 - fx) * fy, w11 = fx * fy;
      const i = (y * w + x) * 4;
      const lum = (.299 * o[i] + .587 * o[i + 1] + .114 * o[i + 2]) / 255;
      const shape = 1 - Math.abs(lum - .5) * 1.1;
      const n = (N[i00] * w00 + N[i10] * w10 + N[i01] * w01 + N[i11] * w11) * mono * shape * 255;
      let r = o[i] + n, g = o[i + 1] + n, b = o[i + 2] + n;
      if (col) {
        const cf = col * shape * 255;
        r += (NR[i00] * w00 + NR[i10] * w10 + NR[i01] * w01 + NR[i11] * w11) * cf;
        g += (NG[i00] * w00 + NG[i10] * w10 + NG[i01] * w01 + NG[i11] * w11) * cf;
        b += (NB[i00] * w00 + NB[i10] * w10 + NB[i01] * w01 + NB[i11] * w11) * cf;
      }
      o[i] = r; o[i + 1] = g; o[i + 2] = b;
    }
  }
  ctx.putImageData(d, 0, 0);
}

// =============== light leak ===============
function drawLeak(ctx, w, h, st) {
  const a = st.leak / 100, R = Math.max(w, h);
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  if (st.leakPos === 'edge') {
    const g = ctx.createLinearGradient(0, 0, w * .45, 0);
    g.addColorStop(0, `rgba(255,60,20,${.95 * a})`);
    g.addColorStop(.25, `rgba(255,130,40,${.55 * a})`);
    g.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  } else {
    const pos = { tr:[1.02, .08], tl:[-.02, .08], br:[1.02, .92], bl:[-.02, .92] }[st.leakPos] || [1.02, .08];
    const cx = w * pos[0], cy = h * pos[1];
    let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * .75);
    g.addColorStop(0, `rgba(255,70,20,${.85 * a})`);
    g.addColorStop(.35, `rgba(255,140,40,${.45 * a})`);
    g.addColorStop(1, 'rgba(255,160,60,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const ox = w - cx, oy = h - cy;
    g = ctx.createRadialGradient(ox, oy, 0, ox, oy, R * .35);
    g.addColorStop(0, `rgba(255,190,90,${.35 * a})`);
    g.addColorStop(1, 'rgba(255,190,90,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
  ctx.restore();
}

// =============== dust & scratches ===============
function drawDust(ctx, w, h, st, scale) {
  ctx.save();
  if (st.dust > 0) {
    const rnd = mulberry32(st.seed);
    const n = Math.round(st.dust / 100 * 160);
    for (let j = 0; j < n; j++) {
      const x = rnd() * w, y = rnd() * h, r = (.4 + rnd() * rnd() * 2.4) * scale, light = rnd() < .65, al = .35 + rnd() * .5;
      ctx.fillStyle = light ? `rgba(255,255,250,${al})` : `rgba(10,8,6,${al})`;
      ctx.beginPath(); ctx.ellipse(x, y, r, r * (.6 + rnd() * .4), rnd() * 3, 0, Math.PI * 2); ctx.fill();
    }
    const rh = mulberry32(st.seed + 7);
    const m = Math.round(st.dust / 100 * 6);
    ctx.lineCap = 'round';
    for (let j = 0; j < m; j++) {
      const x = rh() * w, y = rh() * h, L = (12 + rh() * 30) * scale, light = rh() < .6;
      ctx.strokeStyle = light ? 'rgba(255,255,250,.55)' : 'rgba(10,8,6,.55)';
      ctx.lineWidth = .8 * scale;
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.bezierCurveTo(x + (rh() - .5) * L, y + (rh() - .5) * L, x + (rh() - .5) * L, y + (rh() - .5) * L, x + (rh() - .5) * L, y + (rh() - .5) * L);
      ctx.stroke();
    }
  }
  if (st.scratch > 0) {
    const rs = mulberry32(st.seed + 13);
    const n = 1 + Math.round(st.scratch / 100 * 6);
    for (let j = 0; j < n; j++) {
      let x = rs() * w; const y0 = rs() < .5 ? 0 : rs() * h * .5, y1 = y0 + h * (.3 + rs() * .7);
      ctx.strokeStyle = `rgba(255,255,250,${(.2 + rs() * .35) * Math.min(1, st.scratch / 60)})`;
      ctx.lineWidth = (.5 + rs() * .9) * scale;
      ctx.beginPath(); ctx.moveTo(x, y0);
      const steps = 8;
      for (let s = 1; s <= steps; s++) { x += (rs() - .5) * 3 * scale; ctx.lineTo(x, y0 + (y1 - y0) * s / steps); }
      ctx.stroke();
    }
  }
  ctx.restore();
}

// =============== date stamp ===============
function drawDate(ctx, w, h, st) {
  const v = (dateStr || new Date().toISOString().slice(0, 10)).split('-');
  const text = `'${v[0].slice(2)} ${v[1]} ${v[2]}`;
  const fs = Math.round(Math.min(w, h) * .055);
  const col = { orange:['rgba(255,150,50,.92)', 'rgba(255,80,0,.95)'], red:['rgba(255,80,50,.92)', 'rgba(255,20,0,.95)'], yellow:['rgba(255,215,70,.92)', 'rgba(255,150,0,.9)'] }[st.dateColor] || ['rgba(255,150,50,.92)', 'rgba(255,80,0,.95)'];
  ctx.save();
  ctx.font = `bold ${fs}px "Courier New", Courier, monospace`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.shadowColor = col[1]; ctx.shadowBlur = fs * .45; ctx.fillStyle = col[0];
  ctx.fillText(text, w - fs * 1.1, h - fs * .9);
  ctx.shadowBlur = 0; ctx.fillText(text, w - fs * 1.1, h - fs * .9);
  ctx.restore();
}

// =============== borders ===============
function rotate(cv, dir) {
  const o = mk(cv.height, cv.width), c = o.getContext('2d');
  if (dir > 0) { c.translate(cv.height, 0); c.rotate(Math.PI / 2); }
  else { c.translate(0, cv.width); c.rotate(-Math.PI / 2); }
  c.drawImage(cv, 0, 0); return o;
}
function filmBorder(cv) {
  if (cv.height > cv.width) { const r = rotate(cv, 1); const b = filmBorder(r); free(r); const back = rotate(b, -1); free(b); return back; }
  const w = cv.width, h = cv.height;
  const pad = Math.round(h * .14), side = Math.round(h * .04);
  const out = mk(w + side * 2, h + pad * 2), c = out.getContext('2d');
  c.fillStyle = '#0b0a09'; c.fillRect(0, 0, out.width, out.height);
  c.drawImage(cv, side, pad);
  const hh = pad * .34, hw = hh * .72, gap = hw * 1.9;
  c.fillStyle = '#e6e0d4';
  for (let x = gap * .4; x < out.width - hw; x += gap) {
    rrect(c, x, pad * .1, hw, hh, hw * .2);
    rrect(c, x, out.height - pad * .1 - hh, hw, hh, hw * .2);
  }
  c.fillStyle = 'rgba(255,150,50,.9)';
  c.font = `bold ${Math.round(pad * .2)}px "Courier New", monospace`; c.textBaseline = 'middle';
  c.fillText('400 FILM', side + pad * .4, pad * .73);
  c.fillText('▸ 12A', out.width * .55, pad * .73);
  c.fillText('12', side + pad * .4, out.height - pad * .73);
  c.fillText('▸ 13', out.width * .55, out.height - pad * .73);
  return out;
}
function whiteBorder(cv) {
  const pad = Math.round(Math.min(cv.width, cv.height) * .05);
  const out = mk(cv.width + pad * 2, cv.height + pad * 2), c = out.getContext('2d');
  c.fillStyle = '#f3efe7'; c.fillRect(0, 0, out.width, out.height); c.drawImage(cv, pad, pad);
  return out;
}

// =============== full pipeline ===============
function processImage(src, w, h, st) {
  const scale = Math.max(w, h) / 1200;
  let cv = mk(w, h); const ctx = cv.getContext('2d');
  colorPass(src, w, h, st, ctx);
  if (st.soft > 0) applySoft(cv, st.soft / 100);
  if (st.halation > 0) applyHalation(cv, st.halation / 100);
  if (st.grain > 0 || st.gcolor > 0) applyGrain(cv, st, scale);
  if (st.leak > 0) drawLeak(ctx, w, h, st);
  if (st.dust > 0 || st.scratch > 0) drawDust(ctx, w, h, st, Math.max(.3, scale));
  if (st.date) drawDate(ctx, w, h, st);
  if (st.border === 'film') { const b = filmBorder(cv); free(cv); cv = b; }
  else if (st.border === 'white') { const b = whiteBorder(cv); free(cv); cv = b; }
  return cv;
}

function sourceData(maxSide, maxArea) {
  let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  let sc = Math.min(1, maxSide / Math.max(w, h));
  if (maxArea && w * h * sc * sc > maxArea) sc = Math.sqrt(maxArea / (w * h));
  w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
  const c = mk(w, h), cx = c.getContext('2d');
  cx.imageSmoothingQuality = 'high'; cx.drawImage(img, 0, 0, w, h);
  const data = cx.getImageData(0, 0, w, h); free(c);
  return { data, w, h };
}

// =============== rendering ===============
let pending = false, comparing = false;
function render() {
  if (!srcPrev || pending) return;
  pending = true;
  requestAnimationFrame(() => {
    pending = false;
    if (comparing) return;
    const res = processImage(srcPrev.data, srcPrev.w, srcPrev.h, state);
    view.width = res.width; view.height = res.height;
    vctx.drawImage(res, 0, 0); free(res);
  });
}

// =============== presets (built-in + my recipes) ===============
function loadCustom() { try { return JSON.parse(localStorage.getItem('filmtone-recipes') || '[]'); } catch (e) { return []; } }
function saveCustom(list) { try { localStorage.setItem('filmtone-recipes', JSON.stringify(list)); return true; } catch (e) { return false; } }
function allPresets() {
  return PRESETS.concat(loadCustom().map(c => ({
    id: c.id, name: c.name, custom: true, d: c.vals,
    p: (PRESETS.find(p => p.id === c.base) || PRESETS[0]).p, base: c.base,
  })));
}

function buildPresetStrip() {
  const strip = $('presets'); strip.innerHTML = '';
  allPresets().forEach(pr => {
    const el = document.createElement('div');
    el.className = 'preset' + (pr.id === state.preset.id ? ' on' : '');
    el.dataset.id = pr.id;
    if (srcThumb) {
      const st = Object.assign({}, DEFAULTS, pr.d, { preset: pr, seed: state.seed, date: false, border: 'none' });
      st.grain *= .6;
      const res = processImage(srcThumb.data, srcThumb.w, srcThumb.h, st);
      const c = mk(res.width, res.height); c.getContext('2d').drawImage(res, 0, 0); free(res);
      el.appendChild(c);
    } else { const ph = document.createElement('div'); ph.className = 'ph'; el.appendChild(ph); }
    const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = pr.name; el.appendChild(lab);
    if (pr.custom) {
      const del = document.createElement('div'); del.className = 'del'; del.textContent = '×';
      del.onclick = ev => { ev.stopPropagation(); saveCustom(loadCustom().filter(c => c.id !== pr.id)); if (state.preset.id === pr.id) state.preset = PRESETS[1]; buildPresetStrip(); };
      el.appendChild(del);
    }
    el.onclick = () => selectPreset(pr);
    strip.appendChild(el);
  });
  const add = document.createElement('div'); add.className = 'preset';
  add.innerHTML = '<div class="ph">＋</div><div class="lab">บันทึกสูตร</div>';
  add.onclick = saveRecipe;
  strip.appendChild(add);
}

function saveRecipe() {
  const list = loadCustom();
  const vals = {}; Object.keys(DEFAULTS).forEach(k => vals[k] = state[k]);
  const base = state.preset.custom ? state.preset.base : state.preset.id;
  const item = { id: 'c' + Date.now(), name: 'สูตรของฉัน ' + (list.length + 1), base, vals };
  list.push(item);
  if (!saveCustom(list)) { toast('บันทึกสูตรไม่ได้ในหน้านี้'); return; }
  state.preset = allPresets().find(p => p.id === item.id);
  buildPresetStrip(); toast('บันทึกสูตรแล้ว');
}

function selectPreset(pr) {
  Object.assign(state, DEFAULTS, pr.d);
  state.preset = pr;
  syncUI();
  document.querySelectorAll('.preset').forEach(el => el.classList.toggle('on', el.dataset.id === pr.id));
  render();
}

// =============== controls UI ===============
const controls = {};
function buildControls() {
  const tabs = $('tabs'), panels = $('panels');
  GROUPS.forEach((g, gi) => {
    const t = document.createElement('button'); t.className = 'tab' + (gi === 0 ? ' on' : ''); t.textContent = g.name;
    const pn = document.createElement('div'); pn.className = 'panel' + (gi === 0 ? ' on' : '');
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
      document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
      t.classList.add('on'); pn.classList.add('on');
    };
    tabs.appendChild(t);
    g.items.forEach(it => {
      const row = document.createElement('div'); row.className = 'row';
      const lab = document.createElement('label'); lab.textContent = it.label; row.appendChild(lab);
      if (it.type === 'button') {
        row.removeChild(lab);
        const b = document.createElement('button'); b.className = 'linkbtn'; b.textContent = it.label;
        b.onclick = () => { state.seed = (Math.random() * 1e9) | 0; render(); };
        row.appendChild(b);
      } else if (it.type === 'select') {
        const s = document.createElement('select');
        it.opts.forEach(([v, n]) => { const o = document.createElement('option'); o.value = v; o.textContent = n; s.appendChild(o); });
        s.onchange = () => { state[it.k] = s.value; render(); };
        row.appendChild(s); controls[it.k] = { el: s, it };
      } else if (it.type === 'check') {
        const c = document.createElement('input'); c.type = 'checkbox';
        c.onchange = () => { state[it.k] = c.checked; render(); };
        row.appendChild(c); controls[it.k] = { el: c, it };
      } else if (it.type === 'date') {
        const d = document.createElement('input'); d.type = 'date'; d.value = dateStr;
        d.onchange = () => { dateStr = d.value; if (state.date) render(); };
        row.appendChild(d);
      } else {
        const r = document.createElement('input'); r.type = 'range'; r.min = it.min; r.max = it.max; r.step = 1;
        const v = document.createElement('span'); v.className = 'v';
        r.oninput = () => { state[it.k] = +r.value; v.textContent = it.fmt ? it.fmt(+r.value) : r.value; render(); };
        lab.ondblclick = () => { const def = Object.assign({}, DEFAULTS, state.preset.d)[it.k]; state[it.k] = def; syncUI(); render(); };
        row.appendChild(r); row.appendChild(v); controls[it.k] = { el: r, v, it };
      }
      pn.appendChild(row);
    });
    panels.appendChild(pn);
  });
  const reset = document.createElement('button'); reset.className = 'linkbtn'; reset.textContent = 'รีเซ็ต';
  reset.onclick = () => selectPreset(state.preset);
  tabs.appendChild(reset);
}
function syncUI() {
  Object.entries(controls).forEach(([k, c]) => {
    if (c.it.type === 'check') c.el.checked = !!state[k];
    else c.el.value = state[k];
    if (c.v) c.v.textContent = c.it.fmt ? c.it.fmt(state[k]) : state[k];
  });
}

// =============== camera mode ===============
let mode = 'edit', stream = null, facing = 'environment', liveRAF = 0;
const video = document.createElement('video');
video.muted = true; video.playsInline = true; video.setAttribute('playsinline', ''); video.setAttribute('muted', '');
const liveC = mk(1, 1), liveX = liveC.getContext('2d', { willReadFrequently: true });

// aspect: crop the centre of the camera frame to this width/height ratio (what you see = what you get)
function grabFrame(maxSide, canvas, aspect) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  let sx = 0, sy = 0, sw = vw, sh = vh;
  if (aspect) {
    if (vw / vh > aspect) { sw = Math.round(vh * aspect); sx = Math.round((vw - sw) / 2); }
    else { sh = Math.round(vw / aspect); sy = Math.round((vh - sh) / 2); }
  }
  const sc = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * sc)), h = Math.max(1, Math.round(sh * sc));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const cx = canvas.getContext('2d');
  cx.save();
  if (facing === 'user') { cx.translate(w, 0); cx.scale(-1, 1); }
  cx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  cx.restore();
  return { w, h };
}

let fsOn = false;
const fsView = $('fsView'), fctx = fsView.getContext('2d');
function screenAspect() { return window.innerWidth / window.innerHeight; }

function liveLoop() {
  liveRAF = requestAnimationFrame(liveLoop);
  if (mode !== 'camera') return;
  const d = fsOn ? grabFrame(720, liveC, screenAspect()) : grabFrame(540, liveC);
  if (!d) return;
  let res;
  if (comparing) res = liveC;
  else res = processImage(liveX.getImageData(0, 0, d.w, d.h), d.w, d.h, state);
  const tv = fsOn ? fsView : view, tx = fsOn ? fctx : vctx;
  if (tv.width !== res.width || tv.height !== res.height) { tv.width = res.width; tv.height = res.height; }
  tx.drawImage(res, 0, 0);
  if (res !== liveC) free(res);
}

async function startCam() {
  stopCam();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('เบราว์เซอร์นี้เปิดกล้องสดไม่ได้ ใช้ปุ่ม HD แทนนะ'); return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: false });
  } catch (e) {
    toast(e.name === 'NotAllowedError' ? 'ยังไม่ได้อนุญาตให้ใช้กล้อง' : 'เปิดกล้องไม่ได้ ลองปุ่ม HD แทนนะ');
    return;
  }
  if (mode !== 'camera') { stopCam(); return; }
  video.srcObject = stream;
  try { await video.play(); } catch (e) {}
  view.style.display = 'block'; $('empty').style.display = 'none';
  cancelAnimationFrame(liveRAF); liveLoop();
}
function stopCam() {
  cancelAnimationFrame(liveRAF);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
}

}

// =============== full-screen camera + composition guides ===============
const GUIDES = [
  { id:'none', name:'ไม่มีไกด์', tip:'' },
  { id:'thirds', name:'กฎสามส่วน', tip:'วางจุดสนใจตรงจุดตัดของเส้น' },
  { id:'center', name:'จัดกึ่งกลาง', tip:'วางวัตถุไว้กลางภาพ ให้ดูนิ่งและเด่น' },
  { id:'golden', name:'อัตราส่วนทองคำ', tip:'วางจุดสนใจที่ใจกลางเกลียว · กด ↻ เพื่อหมุน', rot:true },
  { id:'symmetry', name:'สมมาตร', tip:'ให้ซ้าย-ขวา (หรือบน-ล่าง) สะท้อนกันพอดี' },
  { id:'leading', name:'เส้นนำสายตา', tip:'ใช้ถนน ราง รั้ว นำสายตาไปที่จุด · กด ↻ เพื่อย้ายจุด', rot:true },
  { id:'diagonal', name:'เส้นทแยง', tip:'วางเส้นหลักตามแนวทแยง ภาพจะดูมีพลัง' },
  { id:'vshape', name:'รูปตัว V', tip:'ใช้หุบเขา ตึก หรือต้นไม้ที่เป็นรูป V · กด ↻ เพื่อกลับหัว', rot:true },
  { id:'scurve', name:'เส้นโค้ง S', tip:'ใช้ถนนหรือแม่น้ำที่คดเคี้ยวเป็นรูป S · กด ↻ เพื่อกลับด้าน', rot:true },
  { id:'frame', name:'กรอบในกรอบ', tip:'ใช้ประตู หน้าต่าง ซุ้ม เป็นกรอบล้อมวัตถุ' },
  { id:'juxta', name:'คู่ตรงข้าม', tip:'Juxtaposition: วางสองสิ่งที่ต่างกันไว้คนละฝั่ง เช่น เก่า/ใหม่' },
  { id:'repeat', name:'การซ้ำ', tip:'Repetition: หาสิ่งที่เรียงซ้ำเป็นจังหวะ เช่น หน้าต่าง เสา' },
];
let guideId = 'thirds', guideFlip = 0;
try { guideId = localStorage.getItem('filmtone-guide') || 'thirds'; } catch (e) {}

function L(x1, y1, x2, y2, cls) { return `<line class="l ${cls || ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
function D(x, y, r) { return `<circle class="d" cx="${x}" cy="${y}" r="${r || 3.5}"/>`; }
function C(x, y, r, cls) { return `<circle class="l ${cls || ''}" cx="${x}" cy="${y}" r="${r}"/>`; }
function P(d, cls) { return `<path class="l ${cls || ''}" d="${d}"/>`; }

function goldenSpiral(W, H) {
  const phi = 1.6180339887;
  let x = 0, y = 0, w = phi, h = 1, pts = [], squares = '';
  const sxF = W / phi, syF = H;
  for (let i = 0; i < 10; i++) {
    const dir = i % 4; let s, cx, cy, a0;
    if (dir === 0) { s = h; cx = x + s; cy = y + s; a0 = Math.PI; squares += L((x + s) * sxF, y * syF, (x + s) * sxF, (y + h) * syF, 'f'); x += s; w -= s; }
    else if (dir === 1) { s = w; cx = x; cy = y + s; a0 = 1.5 * Math.PI; squares += L(x * sxF, (y + s) * syF, (x + w) * sxF, (y + s) * syF, 'f'); y += s; h -= s; }
    else if (dir === 2) { s = h; cx = x + w - s; cy = y; a0 = 0; squares += L((x + w - s) * sxF, y * syF, (x + w - s) * sxF, (y + h) * syF, 'f'); w -= s; }
    else { s = w; cx = x + s; cy = y + h - s; a0 = .5 * Math.PI; squares += L(x * sxF, (y + h - s) * syF, (x + w) * sxF, (y + h - s) * syF, 'f'); h -= s; }
    for (let k = 0; k <= 16; k++) {
      const a = a0 + (Math.PI / 2) * k / 16;
      pts.push(((cx + s * Math.cos(a)) * sxF).toFixed(1) + ',' + ((cy + s * Math.sin(a)) * syF).toFixed(1));
    }
  }
  return squares + `<polyline class="l" points="${pts.join(' ')}"/>`;
}

function guideSVG(id, W, H, f) {
  const m = Math.min(W, H);
  let s = '';
  switch (id) {
    case 'thirds':
      s = L(W / 3, 0, W / 3, H) + L(2 * W / 3, 0, 2 * W / 3, H) + L(0, H / 3, W, H / 3) + L(0, 2 * H / 3, W, 2 * H / 3)
        + D(W / 3, H / 3) + D(2 * W / 3, H / 3) + D(W / 3, 2 * H / 3) + D(2 * W / 3, 2 * H / 3); break;
    case 'center':
      s = L(W / 2, 0, W / 2, H, 'f') + L(0, H / 2, W, H / 2, 'f') + C(W / 2, H / 2, m * .14)
        + L(W / 2 - 14, H / 2, W / 2 + 14, H / 2) + L(W / 2, H / 2 - 14, W / 2, H / 2 + 14); break;
    case 'golden':
      s = L(W * .382, 0, W * .382, H, 'f') + L(W * .618, 0, W * .618, H, 'f') + L(0, H * .382, W, H * .382, 'f') + L(0, H * .618, W, H * .618, 'f')
        + (H > W ? `<g transform="matrix(0,1,1,0,0,0)">${goldenSpiral(H, W)}</g>` : goldenSpiral(W, H)); break;
    case 'symmetry':
      s = L(W / 2, 0, W / 2, H) + L(0, H / 2, W, H / 2, 'f')
        + P(`M${W / 2 - 34},${H / 2 - 50} l-14,10 l14,10`) + P(`M${W / 2 + 34},${H / 2 - 50} l14,10 l-14,10`); break;
    case 'leading': {
      const vps = [[W / 2, H * .42], [W / 3, H / 3], [2 * W / 3, H / 3], [W / 2, H * .62]];
      const [vx, vy] = vps[f % 4];
      s = L(0, H, vx, vy) + L(W, H, vx, vy) + L(W * .3, H, vx, vy, 'f') + L(W * .7, H, vx, vy, 'f') + L(0, H * .62, vx, vy, 'f') + L(W, H * .62, vx, vy, 'f')
        + C(vx, vy, 9) + D(vx, vy, 3); return s;
    }
    case 'diagonal': {
      const foot = (px, py) => { const t = (px * W + py * H) / (W * W + H * H); return [t * W, t * H]; };
      const foot2 = (px, py) => { const t = (px * W + (py - H) * -H) / (W * W + H * H); return [t * W, H - t * H]; };
      const [ax, ay] = foot(W, 0), [bx, by] = foot(0, H), [cx, cy] = foot2(0, 0), [dx, dy] = foot2(W, H);
      s = L(0, 0, W, H) + L(0, H, W, 0) + L(W, 0, ax, ay, 'f') + L(0, H, bx, by, 'f') + L(0, 0, cx, cy, 'f') + L(W, H, dx, dy, 'f');
      return s;
    }
    case 'vshape':
      s = L(0, 0, W / 2, H * .85) + L(W, 0, W / 2, H * .85) + L(W * .2, 0, W / 2, H * .85, 'f') + L(W * .8, 0, W / 2, H * .85, 'f') + D(W / 2, H * .85); break;
    case 'scurve':
      s = P(`M${W * .28},${H} C${W * .95},${H * .72} ${W * .05},${H * .34} ${W * .7},0`)
        + P(`M${W * .18},${H} C${W * .85},${H * .72} ${W * -.05},${H * .34} ${W * .6},0`, 'f'); break;
    case 'frame': {
      const ix = W * .17, iy = H * .17, iw = W * .66, ih = H * .66, c = m * .07;
      s = `<rect class="l f" x="${ix}" y="${iy}" width="${iw}" height="${ih}" rx="6"/>`
        + P(`M${ix},${iy + c} V${iy} H${ix + c}`) + P(`M${ix + iw - c},${iy} H${ix + iw} V${iy + c}`)
        + P(`M${ix},${iy + ih - c} V${iy + ih} H${ix + c}`) + P(`M${ix + iw - c},${iy + ih} H${ix + iw} V${iy + ih - c}`)
        + D(W / 2, H / 2); break;
    }
    case 'juxta':
      s = L(W / 2, 0, W / 2, H, 'f') + C(W / 4, H / 2, m * .12) + C(3 * W / 4, H / 2, m * .12)
        + `<text x="${W / 4}" y="${H / 2 + 5}" text-anchor="middle">A</text><text x="${3 * W / 4}" y="${H / 2 + 5}" text-anchor="middle">B</text>`; break;
    case 'repeat': {
      const n = 6;
      for (let i = 1; i < n; i++) s += L(W * i / n, 0, W * i / n, H, 'f');
      for (let i = 0; i < n; i++) s += `<rect class="l" x="${W * (i + .5) / n - m * .03}" y="${H * .55}" width="${m * .06}" height="${m * .1}" rx="3"/>`;
      s += L(0, H * .55 + m * .12, W, H * .55 + m * .12, 'f'); break;
    }
  }
  if (!s) return '';
  const sx = f & 1 ? -1 : 1, sy = f & 2 ? -1 : 1;
  return `<g transform="translate(${sx < 0 ? W : 0},${sy < 0 ? H : 0}) scale(${sx},${sy})">${s}</g>`;
}

function drawGuide() {
  const W = window.innerWidth, H = window.innerHeight, g = GUIDES.find(x => x.id === guideId) || GUIDES[0];
  const svg = $('guide');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = guideSVG(g.id, W, H, guideFlip);
  $('fsGuideName').textContent = g.id === 'none' ? 'ไกด์' : g.name;
  $('fsRot').style.display = g.rot ? 'block' : 'none';
}
function fsTip(t) {
  const el = $('fsTip'); if (!t) { el.style.opacity = 0; return; }
  el.textContent = t; el.style.opacity = 1;
  clearTimeout(fsTip.t); fsTip.t = setTimeout(() => el.style.opacity = 0, 2600);
}
function chips(kind) {
  const box = $('fsChips');
  if (box.classList.contains('on') && box.dataset.kind === kind) { box.classList.remove('on'); return; }
  box.dataset.kind = kind; box.innerHTML = '';
  const items = kind === 'guide' ? GUIDES.map(g => ({ id: g.id, name: g.name })) : allPresets().map(p => ({ id: p.id, name: p.name }));
  const cur = kind === 'guide' ? guideId : state.preset.id;
  items.forEach(it => {
    const b = document.createElement('button'); b.className = 'fsb' + (it.id === cur ? ' on' : ''); b.textContent = it.name;
    b.onclick = () => {
      if (kind === 'guide') {
        guideId = it.id; guideFlip = 0; try { localStorage.setItem('filmtone-guide', guideId); } catch (e) {}
        drawGuide(); fsTip((GUIDES.find(g => g.id === it.id) || {}).tip);
      } else {
        selectPreset(allPresets().find(p => p.id === it.id)); $('fsFilterName').textContent = it.name;
      }
      box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    };
    box.appendChild(b);
  });
  box.classList.add('on');
  const on = box.querySelector('.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function showOriginal(on) {
  if (mode === 'camera') { comparing = on; $('badge').style.display = on ? 'block' : 'none'; return; }
  if (!srcPrev) return;
  comparing = on;
  $('badge').style.display = on ? 'block' : 'none';
  if (on) { view.width = srcPrev.w; view.height = srcPrev.h; vctx.putImageData(srcPrev.data, 0, 0); }
  else render();
}

$('save').onclick = () => {
  if (!img) return;
  $('busy').style.display = 'flex';
  setTimeout(async () => {
    let c = null;
    try {
      const src = sourceData(4096, 12500000);
      c = processImage(src.data, src.w, src.h, state);
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.93));
      free(c);
      const file = new File([blob], 'film_' + Date.now() + '.jpg', { type: 'image/jpeg' });
      $('busy').style.display = 'none';
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; }
        catch (err) { if (err.name === 'AbortError') return; }
      }
      $('resultImg').src = URL.createObjectURL(blob);
      $('result').style.display = 'flex';
    } catch (err) {
      free(c);
      $('busy').style.display = 'none';
      toast('บันทึกไม่สำเร็จ: ' + err.message);
    }
  }, 50);
};
$('closeResult').onclick = () => { $('result').style.display = 'none'; };

buildControls();
selectPreset(PRESETS[1]);
buildPresetStrip();

try {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
} catch (e) {}
</script>
</body>
</html>
